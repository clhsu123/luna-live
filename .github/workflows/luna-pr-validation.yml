name: Luna PR validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [eric/luna-openai-xai-20-styles]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: node tests/run-wardrobe-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wardrobe-browser-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
